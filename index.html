<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-App</title>
    <link rel="stylesheet" href="Practice3.css">
</head>
<body>
    <div class="container">
        <h1>Weather</h1>
        <div class="input">
            <input type="text" placeholder="Name the city">
            <button>Search</button>
        </div>
        <div class="Weather">
            <img src="image/cloud.jpg" id="mainImg">
            <h1 id="temp">22°C</h1>
            <h2 id="city">Kathmandu</h2>
        <div class="col">
            <div class="humidity">
              <img src="image/humidity.jpg">  <p>55%</p>
            </div>
            <div class="wind">
              <img src="image/wind.jpg">  <p>30 km/h</p>
            </div>
        </div>
        </div>

    </div>
<script src="practice3.js"></script>
</body>
</html>
